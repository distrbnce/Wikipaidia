name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source checks, unit tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Save extension packages
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension-packages
          path: dist/Wikipaidia-*.zip
          if-no-files-found: error
          retention-days: 7

  browsers:
    name: Browser fixtures (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, msedge, webkit]
    env:
      WIKIPAIDIA_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps "$WIKIPAIDIA_BROWSER"
      - name: Run browser fixture tests
        run: npm run test:browser
      - name: Run installed-extension integration tests
        # Branded Chrome and Edge cannot side-load via automation flags.
        if: matrix.browser == 'chromium'
        run: npm run test:extension
      - name: Save browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
